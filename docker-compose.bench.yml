# Compose de benchmark — mismo proyecto ("proyectofacturas", derivado del
# nombre de carpeta) que docker-compose.yml, así que reutiliza el mismo `db`
# y sus volúmenes en vez de levantar un stack aparte. Solo redefine `app` con
# `image:` en lugar de `build:`, para poder saltar entre las imágenes ya
# construidas de cada palanca sin reconstruir nada.
#
# Uso:
#   BENCH_IMAGE=proyectofacturas-app:base docker compose -f docker-compose.bench.yml up -d --force-recreate app
#   BENCH_IMAGE=proyectofacturas-app:lote20 BENCH_TAMANO_LOTE=20 docker compose -f docker-compose.bench.yml up -d --force-recreate app
#
# Al terminar, volver a docker-compose.yml (la imagen de producción real).
services:
  app:
    image: ${BENCH_IMAGE:?fija BENCH_IMAGE a la imagen de la variante a probar}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://facturas:12345678@db:5432/facturas?schema=public
      UPLOAD_DIR: /data/uploads
      PORT: 3000
      GEMINI_TAMANO_LOTE: ${BENCH_TAMANO_LOTE:-10}
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data/uploads

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
